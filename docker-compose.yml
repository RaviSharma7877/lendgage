# Local MySQL for development. `docker compose up -d` then `npm run db:migrate`.
services:
  mysql:
    image: mysql:8.4
    container_name: pcp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: provisional_certificate
      MYSQL_USER: pcp
      MYSQL_PASSWORD: pcp_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - pcp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pcp-mysql-data:
