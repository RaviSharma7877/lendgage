# Local Postgres for development. `docker compose up -d` then `npm run db:migrate`.
services:
  postgres:
    image: postgres:16
    container_name: pcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: provisional_certificate
      POSTGRES_USER: pcp
      POSTGRES_PASSWORD: pcp_password
    ports:
      - "5432:5432"
    volumes:
      - pcp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcp"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pcp-postgres-data:
